[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wvr_lite"
version = "0.1.0"
description = "WVR Lite SQLite ORM and Repository Suite"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv",
    "pandas",
    "pyodbc",
    "python-dotenv",
    "pytest",
    "ruff",
    "sqlalchemy",
    "sqlacodegen",
    "fastapi",
    "uvicorn",
    "aiosqlite",
    "apscheduler",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "[%(levelname)s] %(asctime)s [%(name)s:%(lineno)d] - %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"